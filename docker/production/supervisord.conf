; 一個容器內執行網站、排程與 Queue（ADR 0002：Render 免費方案沒有 worker 與 cron job）。
; 所有輸出導到容器的 stdout/stderr，在 Render 的 log 面板查看。
; supervisord 與所有程序都以容器的使用者（Dockerfile 的 USER www-data）執行，不要在這裡切換使用者：
; Render 的容器沒有 CAP_KILL，不同使用者之間無法送出結束訊號（#32）。

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
; /run 屬於 root，www-data 寫不進去；nginx 用的是映像內建、已交給 www-data 的 /run/nginx。
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:schedule]
command=php /var/www/html/artisan schedule:work
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
# TiDB 可能在 30 分鐘後中斷連線，worker 每 25 分鐘自行重啟（ADR 0004）。
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=1500
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
