# Render Blueprint：正式環境部署設定（ADR 0002、ADR 0004）。
# 網站以 Docker 映像跑在 Render 免費方案；資料庫為 TiDB Cloud Starter（與 MySQL 相容）。
# 標示 sync: false 的變數不寫進 repo，首次建立 Blueprint 時在 Render 後台填入。
services:
  - type: web
    name: bairi
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    # CI（GitHub Actions）通過後才部署，測試失敗的 commit 不會上線。
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_NAME
        value: 焙日
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # 需為 Laravel 格式（base64:...），以 `php artisan key:generate --show` 產生後貼上。
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: zh_TW
      - key: APP_FALLBACK_LOCALE
        value: en

      # 容器檔案系統不會保留，log 直接輸出到 Render 的 log 面板。
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      # TiDB Cloud 連線資訊，從 TiDB Cloud 後台的 Connect 對話框複製。
      # DB_PORT 為 4000；DB_USERNAME 帶有前綴，例如 xxxxxxxx.root。
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # TiDB Cloud 強制 TLS，憑證由 Let's Encrypt 簽發，使用映像內建的系統 CA。
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      # 讓 database queue 不使用 TiDB 不支援的 SKIP LOCKED（ADR 0004）。
      - key: DB_SERVER_VERSION
        value: "5.7"

      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # 咖啡豆圖片存放在 Cloudflare R2（S3 相容），容器重啟後依然存在（ADR 0008）。
      # 從 R2 後台建立 bucket 並開啟公開網址（r2.dev 或自訂網域），再建立僅限該 bucket 的
      # Object Read & Write API Token。AWS_ENDPOINT 為 https://<ACCOUNT_ID>.r2.cloudflarestorage.com，
      # AWS_URL 為 bucket 的公開網址。
      - key: PRODUCT_IMAGES_DISK
        value: s3
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
