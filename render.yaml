# Render Blueprint：正式環境部署設定（ADR 0002）。
# 網站以 Docker 映像跑在 Render 免費方案；資料庫為 Aiven 免費 MySQL。
# 標示 sync: false 的變數不寫進 repo，首次建立 Blueprint 時在 Render 後台填入。
services:
  - type: web
    name: bairi
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    # CI（GitHub Actions）通過後才部署，測試失敗的 commit 不會上線。
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_NAME
        value: 焙日
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # 需為 Laravel 格式（base64:...），以 `php artisan key:generate --show` 產生後貼上。
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: zh_TW
      - key: APP_FALLBACK_LOCALE
        value: en

      # 容器檔案系統不會保留，log 直接輸出到 Render 的 log 面板。
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      # Aiven MySQL 連線資訊，從 Aiven 後台複製。
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Aiven 強制 SSL。CA 憑證以 Render Secret File 上傳，檔名 aiven-ca.pem，
      # Render 會把它掛載在 /etc/secrets/ 底下。
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/secrets/aiven-ca.pem

      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
