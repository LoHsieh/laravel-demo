# 本機開發環境，帳密僅供本機使用。
services:
  app:
    build: docker/php
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy

  # 端對端測試（Playwright）用的網站：讀取 .env.e2e、使用獨立的 bairi_e2e 資料庫，每次啟動都重建資料。
  # 由 npm run test:e2e 啟動與停止，平常不會跟著 docker compose up 啟動。
  e2e:
    build: docker/php
    profiles: [e2e]
    command: sh -c "php artisan migrate:fresh --seed --seeder=EndToEndSeeder --force && php artisan serve --host=0.0.0.0 --port=8001 --no-reload"
    environment:
      APP_ENV: e2e
      DB_HOST: mysql
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8001/up"]
      interval: 2s
      timeout: 5s
      retries: 60

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bairi
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/create-testing-database.sql:/docker-entrypoint-initdb.d/create-testing-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
