<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>焙日 Bairi 手機商品列表</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&amp;family=Noto+Sans+TC:wght@400;500&amp;family=Noto+Serif+TC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F1EA}
a{color:#8B5A3A}a:hover{color:#26221D}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F5F1EA; color: #26221D; font-family: 'Noto Sans TC', sans-serif; font-size: 15px; line-height: 1.8">
<div style="height: 844px; overflow-y: auto">

<div style="background: #26221D; color: #EFE9DF; font-size: 11px; letter-spacing: 0.04em; padding: 6px 16px; text-align: center; line-height: 1.6">demo 網站・資料閒置後自動重置・測試卡號 4311-9522-2222-2222</div>

<header style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid #DDD5C8">
<a href="HomePhone.dc.html" aria-label="開啟選單" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #26221D">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 8h16M4 16h16"></path></svg>
</a>
<a href="HomePhone.dc.html" style="display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: #26221D">
<span style="font-family: 'Noto Serif TC', serif; font-size: 21px; font-weight: 600; letter-spacing: 0.14em">焙日</span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 12px; letter-spacing: 0.3em">BAIRI</span>
</a>
<a href="CartPhone.dc.html" aria-label="購物車，2 件商品" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 2px; color: #26221D; text-decoration: none">
<svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 8h14l-1.2 12H6.2z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 14px">2</span>
</a>
</header>

<div style="padding: 28px 20px 0">
<div style="display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px">
<h1 style="margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 500; font-size: 26px; letter-spacing: 0.12em">咖啡豆</h1>
<span style="font-size: 13px; color: #6B6257">{{resultText}}</span>
</div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; background: #FBF9F5; border: 1px solid #C9BFB0">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6257" stroke-width="1.4"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">搜尋咖啡豆</span>
<input type="search" value="{{q}}" onChange="{{onSearch}}" placeholder="搜尋名稱或風味" style="flex: 1; min-width: 0; border: 0; background: transparent; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; color: #26221D">
</label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px">
<button type="button" onClick="{{openSheet}}" style="min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; background: transparent; border: 1px solid #26221D; color: #26221D; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>{{filterLabel}}
</button>
<label style="position: relative; display: flex">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">排序</span>
<select value="{{sort}}" onChange="{{onSort}}" style="width: 100%; min-height: 48px; padding: 0 12px; background: transparent; border: 1px solid #C9BFB0; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; color: #26221D; text-align-last: center">
<option value="new">最新上架</option>
<option value="asc">價格低到高</option>
<option value="desc">價格高到低</option>
</select>
</label>
</div>
</div>

<sc-if value="{{hasActive}}" hint-placeholder-val="{{true}}">
<div style="display: flex; gap: 8px; overflow-x: auto; padding: 14px 20px 0">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="1">
<button type="button" onClick="{{c.remove}}" aria-label="{{c.aria}}" style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px 0 14px; background: #26221D; color: #F5F1EA; border: 0; border-radius: 999px; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; cursor: pointer">{{c.label}}<svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<div style="padding: 64px 20px; text-align: center">
<h2 style="margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 500; font-size: 19px; letter-spacing: 0.1em">沒有符合條件的咖啡豆</h2>
<button type="button" onClick="{{clearAll}}" style="min-height: 48px; padding: 0 28px; margin-top: 20px; background: #26221D; color: #F5F1EA; border: 0; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; cursor: pointer">清除所有篩選</button>
</div>
</sc-if>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 14px; padding: 24px 20px 48px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="4">
<a href="ProductPhone.dc.html" style="display: flex; flex-direction: column; gap: 10px; color: #26221D; text-decoration: none">
<div style="position: relative; background: #ECE6DC; aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center">
<div aria-hidden="true" style="position: relative; width: 50%; aspect-ratio: 3 / 4; background: {{p.bag}}; opacity: {{p.opacity}}; border-radius: 2px">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 12%; background: rgba(38, 34, 29, 0.12)"></div>
<div style="position: absolute; left: 16%; right: 16%; top: 32%; bottom: 22%; background: #F8F5EF"></div>
</div>
<sc-if value="{{p.soldOut}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; top: 8px; left: 8px; padding: 0 8px; background: #F5F1EA; border: 1px solid #26221D; font-size: 11px; letter-spacing: 0.1em">已售完</span>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 0">
<span style="font-family: 'Cormorant Garamond', serif; font-size: 11px; letter-spacing: 0.22em; color: #6B6257">{{p.en}}</span>
<span style="font-family: 'Noto Serif TC', serif; font-size: 14px; line-height: 1.5">{{p.name}}</span>
<span style="font-size: 12px; color: #5F574D">{{p.roast}}</span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 16px; margin-top: 2px">{{p.priceText}}</span>
</div>
</a>
</sc-for>
</div>
</div>

<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column">
<button type="button" aria-label="關閉篩選" onClick="{{closeSheet}}" style="flex: 1; background: rgba(38, 34, 29, 0.45); border: 0; cursor: pointer"></button>
<div role="dialog" aria-modal="true" aria-label="篩選" style="height: 680px; display: flex; flex-direction: column; background: #F5F1EA; border-radius: 16px 16px 0 0">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 20px; border-bottom: 1px solid #DDD5C8">
<h2 style="margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 500; font-size: 19px; letter-spacing: 0.12em">篩選</h2>
<div style="display: flex; align-items: center; gap: 4px">
<button type="button" onClick="{{clearAll}}" style="min-height: 44px; padding: 0 10px; background: none; border: 0; color: #26221D; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; text-decoration: underline; cursor: pointer">清除全部</button>
<button type="button" aria-label="關閉篩選" onClick="{{closeSheet}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #26221D; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</div>
<div style="flex: 1; overflow-y: auto; padding: 8px 20px 24px">
<sc-for list="{{groups}}" as="grp" hint-placeholder-count="4">
<fieldset style="margin: 0; padding: 20px 0; border: 0; border-bottom: 1px solid #DDD5C8">
<legend style="float: left; width: 100%; padding: 0; margin-bottom: 12px; font-size: 14px; letter-spacing: 0.12em">{{grp.label}}</legend>
<div style="clear: both; display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{grp.options}}" as="opt" hint-placeholder-count="4">
<sc-if value="{{opt.checked}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" onClick="{{opt.toggle}}" style="min-height: 40px; padding: 0 16px; background: #26221D; color: #F5F1EA; border: 1px solid #26221D; border-radius: 999px; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; cursor: pointer">{{opt.label}}</button>
</sc-if>
<sc-if value="{{opt.idle}}" hint-placeholder-val="{{true}}">
<button type="button" aria-pressed="false" onClick="{{opt.toggle}}" style="min-height: 40px; padding: 0 16px; background: transparent; color: #26221D; border: 1px solid #C9BFB0; border-radius: 999px; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; cursor: pointer">{{opt.label}}</button>
</sc-if>
</sc-for>
</div>
</fieldset>
</sc-for>
</div>
<div style="padding: 12px 20px 24px; border-top: 1px solid #DDD5C8; background: #FBF9F5">
<button type="button" onClick="{{closeSheet}}" style="width: 100%; min-height: 52px; background: #26221D; color: #F5F1EA; border: 0; font-family: 'Noto Sans TC', sans-serif; font-size: 15px; letter-spacing: 0.12em; cursor: pointer">{{applyLabel}}</button>
</div>
</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sheetOpen":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
var BAIRI_BEANS = [
{ id: 1, name: '耶加雪菲 孔加 水洗', en: 'ETHIOPIA', origin: '衣索比亞', process: '水洗', roast: '淺焙', flavors: ['花香', '果酸'], notes: '茉莉・檸檬・紅茶', price: 260, bag: '#C6B193', soldOut: false },
{ id: 2, name: '肯亞 涅里 AA 水洗', en: 'KENYA', origin: '肯亞', process: '水洗', roast: '淺中焙', flavors: ['果酸'], notes: '黑醋栗・葡萄柚・蔗糖', price: 320, bag: '#BBA27F', soldOut: false },
{ id: 3, name: '哥倫比亞 慧蘭 水洗', en: 'COLOMBIA', origin: '哥倫比亞', process: '水洗', roast: '中焙', flavors: ['堅果'], notes: '焦糖・蘋果・杏仁', price: 240, bag: '#A88F6E', soldOut: false },
{ id: 4, name: '瓜地馬拉 安提瓜 日曬', en: 'GUATEMALA', origin: '瓜地馬拉', process: '日曬', roast: '中深焙', flavors: ['巧克力', '堅果'], notes: '可可・黑糖・烤堅果', price: 240, bag: '#8E765B', soldOut: true },
{ id: 5, name: '巴拿馬 波奎特 日曬', en: 'PANAMA', origin: '巴拿馬', process: '日曬', roast: '淺中焙', flavors: ['果酸', '巧克力'], notes: '草莓・蜂蜜・可可', price: 380, bag: '#CBB89B', soldOut: false },
{ id: 6, name: '衣索比亞 古吉 日曬', en: 'ETHIOPIA', origin: '衣索比亞', process: '日曬', roast: '淺焙', flavors: ['花香', '果酸'], notes: '藍莓・玫瑰・紅酒', price: 300, bag: '#D0BE9F', soldOut: false },
{ id: 7, name: '哥斯大黎加 塔拉珠 蜜處理', en: 'COSTA RICA', origin: '哥斯大黎加', process: '蜜處理', roast: '中焙', flavors: ['堅果', '巧克力'], notes: '蜂蜜・榛果・牛奶巧克力', price: 340, bag: '#B49B78', soldOut: false },
{ id: 8, name: '巴西 喜拉朵 日曬', en: 'BRAZIL', origin: '巴西', process: '日曬', roast: '深焙', flavors: ['巧克力', '堅果'], notes: '黑巧克力・花生・黑糖', price: 220, bag: '#7F6A52', soldOut: false }
];
var BAIRI_GROUPS = [
{ key: 'flavor', label: '風味', options: ['花香', '果酸', '堅果', '巧克力'], get: function (b) { return b.flavors; } },
{ key: 'origin', label: '產地', options: ['衣索比亞', '肯亞', '哥倫比亞', '瓜地馬拉', '巴拿馬', '哥斯大黎加', '巴西'], get: function (b) { return [b.origin]; } },
{ key: 'process', label: '處理法', options: ['水洗', '日曬', '蜜處理'], get: function (b) { return [b.process]; } },
{ key: 'roast', label: '烘焙度', options: ['淺焙', '淺中焙', '中焙', '中深焙', '深焙'], get: function (b) { return [b.roast]; } }
];
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sel: { flavor: ['果酸'], origin: [], process: [], roast: [] }, q: '', sort: 'new', open: null };
}
toggle(key, val) {
var cur = this.state.sel[key];
var next = cur.indexOf(val) >= 0 ? cur.filter(function (v) { return v !== val; }) : cur.concat([val]);
var sel = Object.assign({}, this.state.sel);
sel[key] = next;
this.setState({ sel: sel });
}
renderVals() {
var self = this;
var s = this.state;
var q = s.q.trim();
var list = BAIRI_BEANS.filter(function (b) {
var okGroups = BAIRI_GROUPS.every(function (g) {
var chosen = s.sel[g.key];
if (chosen.length === 0) return true;
return g.get(b).some(function (v) { return chosen.indexOf(v) >= 0; });
});
var okQ = !q || b.name.indexOf(q) >= 0 || b.notes.indexOf(q) >= 0;
return okGroups && okQ;
});
list = list.slice().sort(function (a, b) {
if (s.sort === 'asc') return a.price - b.price;
if (s.sort === 'desc') return b.price - a.price;
return b.id - a.id;
});
var activeCount = 0;
var chips = [];
BAIRI_GROUPS.forEach(function (g) {
s.sel[g.key].forEach(function (v) {
activeCount += 1;
chips.push({ label: v, aria: '移除篩選：' + v, remove: function () { self.toggle(g.key, v); } });
});
});
if (q) chips.push({ label: '「' + q + '」', aria: '清除搜尋', remove: function () { self.setState({ q: '' }); } });
var open = s.open === null ? !!this.props.sheetOpen : s.open;
return {
groups: BAIRI_GROUPS.map(function (g) {
return {
label: g.label,
options: g.options.map(function (o) {
var checked = s.sel[g.key].indexOf(o) >= 0;
return { label: o, checked: checked, idle: !checked, toggle: function () { self.toggle(g.key, o); } };
})
};
}),
chips: chips,
hasActive: chips.length > 0,
q: s.q,
sort: s.sort,
onSearch: function (e) { self.setState({ q: e.target.value }); },
onSort: function (e) { self.setState({ sort: e.target.value }); },
clearAll: function () { self.setState({ sel: { flavor: [], origin: [], process: [], roast: [] }, q: '' }); },
products: list.map(function (b) {
return { name: b.name, en: b.en, roast: b.roast + '・' + b.process, bag: b.bag, opacity: b.soldOut ? 0.55 : 1, soldOut: b.soldOut, priceText: 'NT$' + b.price + ' 起' };
}),
isEmpty: list.length === 0,
resultText: '共 ' + list.length + ' 支',
filterLabel: activeCount > 0 ? '篩選（' + activeCount + '）' : '篩選',
applyLabel: '查看 ' + list.length + ' 支咖啡豆',
sheetOpen: open,
openSheet: function () { self.setState({ open: true }); },
closeSheet: function () { self.setState({ open: false }); }
};
}
}
</script>
</body>
</html>
