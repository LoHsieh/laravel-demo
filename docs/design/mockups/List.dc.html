<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>焙日 Bairi 商品列表</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&amp;family=Noto+Sans+TC:wght@400;500&amp;family=Noto+Serif+TC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F1EA}
a{color:#8B5A3A}a:hover{color:#26221D}
</style>
</helmet>
<div style="min-height: 100vh; background: #F5F1EA; color: #26221D; font-family: 'Noto Sans TC', sans-serif; font-size: 15px; line-height: 1.8">

<div style="background: #26221D; color: #EFE9DF; font-size: 12px; letter-spacing: 0.08em; padding: 8px 16px; text-align: center">這是作品展示用的 demo 網站，資料會在閒置後自動重置　·　綠界測試卡號 4311-9522-2222-2222</div>

<header style="border-bottom: 1px solid #DDD5C8">
<div style="max-width: 1200px; margin: 0 auto; padding: 20px clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 40px">
<a href="Main.dc.html" style="display: flex; align-items: baseline; gap: 12px; text-decoration: none; color: #26221D">
<span style="font-family: 'Noto Serif TC', serif; font-size: 26px; font-weight: 600; letter-spacing: 0.14em">焙日</span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 0.32em">BAIRI</span>
</a>
<nav aria-label="主選單" style="display: flex; flex-wrap: wrap; gap: 8px 36px; font-size: 14px; letter-spacing: 0.1em">
<a href="List.dc.html" aria-current="page" style="text-decoration: none; color: #26221D; border-bottom: 1px solid #26221D">咖啡豆</a>
<a href="Main.dc.html" style="text-decoration: none; color: #26221D">依風味找</a>
<a href="Main.dc.html" style="text-decoration: none; color: #26221D">關於焙日</a>
</nav>
<div style="display: flex; align-items: center; gap: 4px">
<a href="#" aria-label="會員登入" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #26221D">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M4.5 20c1.2-3.6 4.1-5.5 7.5-5.5s6.3 1.9 7.5 5.5"></path></svg>
</a>
<a href="Cart.dc.html" aria-label="購物車，2 件商品" style="height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 8px; color: #26221D; text-decoration: none">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 8h14l-1.2 12H6.2z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 16px">2</span>
</a>
</div>
</div>
</header>

<main style="max-width: 1200px; margin: 0 auto; padding: 56px clamp(16px, 4vw, 48px) 120px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; margin-bottom: 48px">
<h1 style="margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 500; font-size: 34px; letter-spacing: 0.12em">咖啡豆</h1>
<span style="font-size: 14px; color: #6B6257">{{resultText}}</span>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 48px 56px">

<aside aria-label="篩選條件" style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 32px">
<sc-for list="{{groups}}" as="grp" hint-placeholder-count="4">
<fieldset style="margin: 0; padding: 0 0 28px; border: 0; border-bottom: 1px solid #DDD5C8">
<legend style="padding: 0; margin-bottom: 12px; font-family: 'Noto Serif TC', serif; font-size: 16px; letter-spacing: 0.12em">{{grp.label}}</legend>
<div style="display: flex; flex-direction: column">
<sc-for list="{{grp.options}}" as="opt" hint-placeholder-count="4">
<label style="display: flex; align-items: center; gap: 12px; min-height: 36px; font-size: 14px; cursor: pointer">
<input type="checkbox" checked="{{opt.checked}}" onChange="{{opt.toggle}}" style="width: 16px; height: 16px; margin: 0; accent-color: #26221D">
<span style="flex: 1">{{opt.label}}</span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 15px; color: #6B6257">{{opt.count}}</span>
</label>
</sc-for>
</div>
</fieldset>
</sc-for>
</aside>

<div style="flex: 999 1 560px; min-width: 0">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding-bottom: 20px; border-bottom: 1px solid #DDD5C8">
<label style="flex: 1 1 260px; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px; background: #FBF9F5; border: 1px solid #C9BFB0">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6257" stroke-width="1.4"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">搜尋咖啡豆</span>
<input type="search" value="{{q}}" onChange="{{onSearch}}" placeholder="搜尋名稱或風味，例如：莓果" style="flex: 1; min-width: 0; border: 0; background: transparent; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; color: #26221D; outline-offset: 4px">
</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #6B6257">排序
<select value="{{sort}}" onChange="{{onSort}}" style="min-height: 48px; padding: 0 12px; background: #FBF9F5; border: 1px solid #C9BFB0; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; color: #26221D">
<option value="new">最新上架</option>
<option value="asc">價格：低到高</option>
<option value="desc">價格：高到低</option>
</select>
</label>
</div>

<sc-if value="{{hasActive}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 16px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="1">
<button type="button" onClick="{{c.remove}}" aria-label="{{c.aria}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px 0 16px; background: #26221D; color: #F5F1EA; border: 0; border-radius: 999px; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; cursor: pointer">{{c.label}}<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</sc-for>
<button type="button" onClick="{{clearAll}}" style="min-height: 36px; padding: 0 8px; background: none; border: 0; color: #26221D; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; text-decoration: underline; cursor: pointer">清除全部</button>
</div>
</sc-if>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<div style="padding: 96px 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<h2 style="margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 500; font-size: 22px; letter-spacing: 0.12em">沒有符合條件的咖啡豆</h2>
<p style="margin: 0; font-size: 14px; color: #5F574D">試著減少篩選條件，或換個關鍵字。</p>
<button type="button" onClick="{{clearAll}}" style="min-height: 52px; padding: 0 36px; margin-top: 12px; background: #26221D; color: #F5F1EA; border: 0; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; letter-spacing: 0.14em; cursor: pointer">清除所有篩選</button>
</div>
</sc-if>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 48px 28px; padding-top: 36px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="6">
<a href="Product.dc.html" style="display: flex; flex-direction: column; gap: 18px; color: #26221D; text-decoration: none">
<div style="position: relative; background: #ECE6DC; aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center">
<div aria-hidden="true" style="position: relative; width: 50%; aspect-ratio: 3 / 4; background: {{p.bag}}; opacity: {{p.opacity}}; border-radius: 2px; box-shadow: 0 24px 40px -24px rgba(38, 34, 29, 0.45)">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 12%; background: rgba(38, 34, 29, 0.12)"></div>
<div style="position: absolute; left: 16%; right: 16%; top: 32%; bottom: 22%; background: #F8F5EF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><span style="font-family: 'Noto Serif TC', serif; font-size: 12px; letter-spacing: 0.2em">焙日</span><span style="width: 14px; height: 1px; background: #26221D"></span></div>
</div>
<sc-if value="{{p.soldOut}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; top: 14px; left: 14px; padding: 0 12px; background: #F5F1EA; border: 1px solid #26221D; font-size: 12px; letter-spacing: 0.14em">已售完</span>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Cormorant Garamond', serif; font-size: 13px; letter-spacing: 0.26em; color: #6B6257">{{p.en}}</span>
<span style="font-family: 'Noto Serif TC', serif; font-size: 17px; letter-spacing: 0.06em; line-height: 1.5">{{p.name}}</span>
<span style="font-size: 13px; color: #5F574D">{{p.notes}}</span>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding-top: 10px; border-top: 1px solid #DDD5C8; font-size: 13px">
<span style="color: #5F574D">{{p.roast}}・{{p.process}}</span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 17px">{{p.priceText}}</span>
</div>
</div>
</a>
</sc-for>
</div>

<sc-if value="{{showPager}}" hint-placeholder-val="{{true}}">
<nav aria-label="分頁" style="display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 72px; font-family: 'Cormorant Garamond', serif; font-size: 17px">
<a href="#" aria-current="page" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #26221D; color: #F5F1EA; text-decoration: none">1</a>
<a href="#" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #26221D; text-decoration: none">2</a>
<a href="#" style="height: 44px; display: flex; align-items: center; padding: 0 12px; color: #26221D; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; text-decoration: none">下一頁</a>
</nav>
</sc-if>
</div>

</div>
</main>

<footer style="border-top: 1px solid #DDD5C8">
<div style="max-width: 1200px; margin: 0 auto; padding: 48px clamp(16px, 4vw, 48px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 40px; font-size: 13px; color: #5F574D">
<div style="display: flex; align-items: baseline; gap: 10px; color: #26221D">
<span style="font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 600; letter-spacing: 0.14em">焙日</span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 13px; letter-spacing: 0.3em">BAIRI</span>
</div>
<p style="margin: 0">作品展示用 demo，並非真實營業的商店。</p>
<a href="https://github.com/LoHsieh/laravel-demo" style="display: inline-flex; align-items: center; min-height: 44px; color: #26221D; letter-spacing: 0.1em">原始碼 GitHub</a>
</div>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
var BAIRI_BEANS = [
{ id: 1, name: '耶加雪菲 孔加 水洗', en: 'ETHIOPIA', origin: '衣索比亞', process: '水洗', roast: '淺焙', flavors: ['花香', '果酸'], notes: '茉莉・檸檬・紅茶', price: 260, bag: '#C6B193', soldOut: false },
{ id: 2, name: '肯亞 涅里 AA 水洗', en: 'KENYA', origin: '肯亞', process: '水洗', roast: '淺中焙', flavors: ['果酸'], notes: '黑醋栗・葡萄柚・蔗糖', price: 320, bag: '#BBA27F', soldOut: false },
{ id: 3, name: '哥倫比亞 慧蘭 水洗', en: 'COLOMBIA', origin: '哥倫比亞', process: '水洗', roast: '中焙', flavors: ['堅果'], notes: '焦糖・蘋果・杏仁', price: 240, bag: '#A88F6E', soldOut: false },
{ id: 4, name: '瓜地馬拉 安提瓜 日曬', en: 'GUATEMALA', origin: '瓜地馬拉', process: '日曬', roast: '中深焙', flavors: ['巧克力', '堅果'], notes: '可可・黑糖・烤堅果', price: 240, bag: '#8E765B', soldOut: true },
{ id: 5, name: '巴拿馬 波奎特 日曬', en: 'PANAMA', origin: '巴拿馬', process: '日曬', roast: '淺中焙', flavors: ['果酸', '巧克力'], notes: '草莓・蜂蜜・可可', price: 380, bag: '#CBB89B', soldOut: false },
{ id: 6, name: '衣索比亞 古吉 日曬', en: 'ETHIOPIA', origin: '衣索比亞', process: '日曬', roast: '淺焙', flavors: ['花香', '果酸'], notes: '藍莓・玫瑰・紅酒', price: 300, bag: '#D0BE9F', soldOut: false },
{ id: 7, name: '哥斯大黎加 塔拉珠 蜜處理', en: 'COSTA RICA', origin: '哥斯大黎加', process: '蜜處理', roast: '中焙', flavors: ['堅果', '巧克力'], notes: '蜂蜜・榛果・牛奶巧克力', price: 340, bag: '#B49B78', soldOut: false },
{ id: 8, name: '巴西 喜拉朵 日曬', en: 'BRAZIL', origin: '巴西', process: '日曬', roast: '深焙', flavors: ['巧克力', '堅果'], notes: '黑巧克力・花生・黑糖', price: 220, bag: '#7F6A52', soldOut: false }
];
var BAIRI_GROUPS = [
{ key: 'flavor', label: '風味', options: ['花香', '果酸', '堅果', '巧克力'], get: function (b) { return b.flavors; } },
{ key: 'origin', label: '產地', options: ['衣索比亞', '肯亞', '哥倫比亞', '瓜地馬拉', '巴拿馬', '哥斯大黎加', '巴西'], get: function (b) { return [b.origin]; } },
{ key: 'process', label: '處理法', options: ['水洗', '日曬', '蜜處理'], get: function (b) { return [b.process]; } },
{ key: 'roast', label: '烘焙度', options: ['淺焙', '淺中焙', '中焙', '中深焙', '深焙'], get: function (b) { return [b.roast]; } }
];
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sel: { flavor: ['果酸'], origin: [], process: [], roast: [] }, q: '', sort: 'new' };
}
toggle(key, val) {
var cur = this.state.sel[key];
var next = cur.indexOf(val) >= 0 ? cur.filter(function (v) { return v !== val; }) : cur.concat([val]);
var sel = Object.assign({}, this.state.sel);
sel[key] = next;
this.setState({ sel: sel });
}
renderVals() {
var self = this;
var s = this.state;
var q = s.q.trim();
var list = BAIRI_BEANS.filter(function (b) {
var okGroups = BAIRI_GROUPS.every(function (g) {
var chosen = s.sel[g.key];
if (chosen.length === 0) return true;
return g.get(b).some(function (v) { return chosen.indexOf(v) >= 0; });
});
var okQ = !q || b.name.indexOf(q) >= 0 || b.notes.indexOf(q) >= 0;
return okGroups && okQ;
});
list = list.slice().sort(function (a, b) {
if (s.sort === 'asc') return a.price - b.price;
if (s.sort === 'desc') return b.price - a.price;
return b.id - a.id;
});
var groups = BAIRI_GROUPS.map(function (g) {
return {
label: g.label,
options: g.options.map(function (o) {
return {
label: o,
count: BAIRI_BEANS.filter(function (b) { return g.get(b).indexOf(o) >= 0; }).length,
checked: s.sel[g.key].indexOf(o) >= 0,
toggle: function () { self.toggle(g.key, o); }
};
})
};
});
var chips = [];
BAIRI_GROUPS.forEach(function (g) {
s.sel[g.key].forEach(function (v) {
chips.push({ label: v, aria: '移除篩選：' + v, remove: function () { self.toggle(g.key, v); } });
});
});
if (q) chips.push({ label: '「' + q + '」', aria: '清除搜尋', remove: function () { self.setState({ q: '' }); } });
return {
groups: groups,
chips: chips,
hasActive: chips.length > 0,
q: s.q,
sort: s.sort,
onSearch: function (e) { self.setState({ q: e.target.value }); },
onSort: function (e) { self.setState({ sort: e.target.value }); },
clearAll: function () { self.setState({ sel: { flavor: [], origin: [], process: [], roast: [] }, q: '' }); },
products: list.map(function (b) {
return { name: b.name, en: b.en, notes: b.notes, roast: b.roast, process: b.process, bag: b.bag, opacity: b.soldOut ? 0.55 : 1, soldOut: b.soldOut, priceText: 'NT$' + b.price + ' 起' };
}),
isEmpty: list.length === 0,
showPager: list.length > 6,
resultText: '共 ' + list.length + ' 支'
};
}
}
</script>
</body>
</html>
